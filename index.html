<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Organic Chemistry Through the AP Lens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a lab-bench session. Sticky station rail with student name, autosave and progress; one station at a time. Build with the kit, watch the 3D answer, then tie each idea to the AP exam. */
:root{
  --bg:#F4F7FA;--surface:#FFFFFF;--surface2:#EAF1F6;--ink:#12253D;--muted:#506078;--line:#D3DDE8;
  --teal:#0B7F83;--teal-soft:#DDF1F1;--teal-ink:#066064;--orange:#C95A00;--orange-soft:#FFEBD9;--orange-ink:#A24700;--on-orange:#FFFFFF;
  --good:#15803D;--good-soft:#E0F4E7;--bad:#B42318;--bad-soft:#FDE7E4;--warn:#9A6410;
  --red:#D9433B;--blue:#2F6FD0;--slate:#6B7C93;
  --accent-rgb:11,127,131;--stage:#E6F1FA;--grid:rgba(30,136,168,.14);
  --bond:#8996A6;--bondEdge:#56667A;--rim:rgba(18,37,61,.38);--tagBg:#FFFFFF;--tagInk:#12253D;
  --f-head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1626;--surface:#142238;--surface2:#1B2D48;--ink:#E8EEF6;--muted:#9FB1C8;--line:#2A3C58;
  --teal:#4FD0CC;--teal-soft:#14373D;--teal-ink:#4FD0CC;--orange:#FF9B47;--orange-soft:#3A2614;--orange-ink:#FF9B47;--on-orange:#1A1206;
  --good:#4ADE80;--good-soft:#12301F;--bad:#FF8A7A;--bad-soft:#3A1713;--warn:#FFC857;
  --red:#F27A72;--blue:#6DB4EE;--slate:#8FA6C2;
  --accent-rgb:79,208,204;--stage:#0E2744;--grid:rgba(79,208,204,.11);
  --bond:#B3BFCE;--bondEdge:#7D8BA0;--rim:rgba(255,255,255,.32);--tagBg:#142238;--tagInk:#E8EEF6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1626;--surface:#142238;--surface2:#1B2D48;--ink:#E8EEF6;--muted:#9FB1C8;--line:#2A3C58;
  --teal:#4FD0CC;--teal-soft:#14373D;--teal-ink:#4FD0CC;--orange:#FF9B47;--orange-soft:#3A2614;--orange-ink:#FF9B47;--on-orange:#1A1206;
  --good:#4ADE80;--good-soft:#12301F;--bad:#FF8A7A;--bad-soft:#3A1713;--warn:#FFC857;
  --red:#F27A72;--blue:#6DB4EE;--slate:#8FA6C2;
  --accent-rgb:79,208,204;--stage:#0E2744;--grid:rgba(79,208,204,.11);
  --bond:#B3BFCE;--bondEdge:#7D8BA0;--rim:rgba(255,255,255,.32);--tagBg:#142238;--tagInk:#E8EEF6;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance}
sub{font-size:.72em;line-height:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
code,.mono{font-family:var(--f-mono);font-size:.92em}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-block:10px 4px}
.brand .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-ink)}
.brand h1{font-size:21px;line-height:1.2;font-weight:700}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.who input{font:inherit;font-size:14px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:150px;max-width:100%}
.who input:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.whoname{font-size:14.5px;display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.whohint{flex-basis:100%;text-align:right;font-size:12.5px;color:var(--warn);min-height:0}
.whohint:empty{display:none}
.savest{font-size:12px;color:var(--muted);white-space:nowrap}
.btn-danger{border-color:var(--orange);color:var(--orange-ink)}
.btn-danger:hover:not(:disabled){background:var(--orange-soft)}
.donebar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 16px;margin:6px 0 14px}
.donebar.on{border-left-color:var(--good);background:var(--good-soft)}
.donebar b{display:block;font-family:var(--f-head);font-size:17px}
.donebar.on b{color:var(--good)}
.sb{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13.5px}
.sb-tr{flex:1;height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.sb-tr i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
.sb b{font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:60;background:rgba(8,18,32,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.mcard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:420px;width:100%;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.frqta{width:100%;margin:6px 0 10px;font:inherit;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical;min-height:110px}
.frqta:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.modal[hidden],.resume[hidden]{display:none!important}
.mcard h3{font-size:21px}
.mcard .btn-row{display:flex;gap:8px;flex-wrap:wrap}
.resume{border:1px solid var(--teal);background:var(--teal-soft);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.resume p{font-size:14.5px;margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 13px;font-weight:700;font-size:14px;line-height:1.3;display:inline-flex;align-items:center;gap:7px}
.btn:hover:not(:disabled){border-color:var(--teal)}
.btn:disabled{opacity:.45;cursor:default}
.btn-report{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn-report{color:#06292B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-report{color:#06292B}}
.btn-report:hover:not(:disabled){filter:brightness(1.08)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:var(--on-orange)}
.btn svg{width:15px;height:15px;flex:none}
.rail{display:flex;overflow-x:auto;scrollbar-width:thin;margin-top:2px}
.stop{flex:1 0 auto;min-width:104px;display:grid;grid-template-columns:auto 1fr;column-gap:7px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px 7px;color:var(--muted)}
.stop:hover{background:var(--surface2)}
.stop[aria-current="true"]{border-bottom-color:var(--orange);color:var(--ink)}
.stop-n{font:700 15px var(--f-head);font-variant-numeric:tabular-nums}
.stop-name{font-weight:700;font-size:13px;line-height:1.25}
.stop-t{grid-column:2;font-size:11.5px;color:var(--muted)}
.stop.done .stop-n{color:var(--good)}
.stop.late .stop-t{color:var(--warn);font-weight:700}
.stop svg{width:13px;height:13px;vertical-align:-1px}

.page{padding-block:22px 84px}
.mod{display:none}.mod.on{display:block}
.mod-head{display:grid;gap:6px;margin-bottom:16px;max-width:78ch}
.eyebrow2{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}
.mod-head h2{font-size:clamp(26px,4vw,36px);line-height:1.12;font-weight:700}
.mod-goal{color:var(--muted);text-wrap:pretty}
.aplink{background:var(--orange-soft);border:1px solid var(--orange);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--ink);text-wrap:pretty}
.aplink b{color:var(--orange-ink);font-family:var(--f-head)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px;min-width:0}
.card-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:14px}
.card-h h3{font-size:20px;font-weight:700;line-height:1.25}
.tag{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--teal-ink)}
.brief{max-width:78ch;text-wrap:pretty}
.pnote{font-size:13.5px;color:var(--muted);text-wrap:pretty}

.ex{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:20px;align-items:start}
.stage{position:relative;aspect-ratio:4/3;min-height:240px;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background-color:var(--stage);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage-hint{position:absolute;left:10px;top:8px;font-size:11.5px;color:var(--muted);pointer-events:none}
.stage-tools{position:absolute;right:8px;top:6px;display:flex;gap:6px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11.5px}
.mini[aria-pressed="true"]{color:var(--teal-ink);border-color:var(--teal)}
.kitbar{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px;align-items:center}
.cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--rim);flex:none;display:inline-block}
.stick{width:15px;height:0;border-top:4px solid var(--bond);border-radius:2px;flex:none;display:inline-block}
.stick.d{height:5px;border-top:2px solid var(--bond);border-bottom:2px solid var(--bond)}
.stick.t{height:8px;border-top:2px solid var(--bond);border-bottom:2px solid var(--bond);background:linear-gradient(var(--bond),var(--bond)) center/100% 2px no-repeat}
.steps{display:grid;gap:6px;list-style:none;padding:0;margin:0}
.step{width:100%;text-align:left;display:grid;grid-template-columns:26px 1fr;gap:4px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.step:hover{border-color:var(--teal)}
.step-n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.step-t{font-weight:700;font-size:14.5px;line-height:1.35;align-self:center}
.step-d{grid-column:2;font-size:14px;color:var(--muted);display:none;text-wrap:pretty}
.step.past .step-n{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.step.cur{border-color:var(--teal);background:var(--teal-soft)}
.step.cur .step-n{background:var(--teal);border-color:var(--teal);color:var(--surface)}
.step.cur .step-d{display:block;color:var(--ink)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.leg{display:grid;grid-template-columns:34px 1fr;gap:2px 10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface)}
.ball{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:1px solid var(--rim)}
.leg span{font-size:13px;color:var(--muted);line-height:1.35}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;list-style:none;padding:0;margin:0;counter-reset:f}
.flow li{counter-increment:f;border-top:3px solid var(--teal);background:var(--surface2);padding:9px 11px 10px;font-size:14px;border-radius:0 0 8px 8px}
.flow li::before{content:counter(f);font:700 16px var(--f-head);color:var(--teal-ink);margin-right:7px}
.flow b{display:block}
.subhead{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:14px 0 8px}

.kitline{margin:12px 0 4px;padding:9px 12px;background:var(--surface2);border-radius:8px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:14px}
.qs{display:grid;gap:14px;margin:16px 0 6px}
.q-text{font-weight:700;margin-bottom:8px;text-wrap:pretty;max-width:78ch}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 13px;text-align:left;font-size:14.5px;max-width:100%}
.opt:hover:not(:disabled){border-color:var(--orange)}
.opt.ok{background:var(--good-soft);border-color:var(--good);font-weight:700}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{font-size:14.5px;margin-top:7px;max-width:78ch;text-wrap:pretty}
.fb:empty{display:none}
.fb.ok{color:var(--good)}.fb.bad{color:var(--bad)}
.reveal-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,232px),1fr));gap:12px;margin-top:14px}
.rcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin:0}
.rcard .stage{aspect-ratio:1/1;min-height:0;border:0;border-bottom:1px solid var(--line);border-radius:0}
.rcap{padding:9px 11px 11px;display:grid;gap:2px}
.rcap .fx{font-size:13px;color:var(--muted)}
.modnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.modnav .pulse{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.3)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink);background:var(--surface2)}
tbody tr:nth-child(even){background:var(--surface2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
.teacher{margin-bottom:18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.teacher summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:14.5px}
.teacher .body{padding:2px 14px 14px;display:grid;gap:12px;font-size:14px}
.teacher ul{margin:0;padding-left:18px}

/* skeletal + compare + ranking + chemistry widgets */
.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.sk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.sk svg.fig{width:100%;max-width:340px;height:auto;background:var(--surface2);border-radius:8px}
.fig text{font-family:var(--f-body)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.sel{display:flex;flex-wrap:wrap;gap:10px 16px;margin-bottom:12px}
.sel label{display:grid;gap:3px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sel select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:210px;max-width:100%;text-transform:none;letter-spacing:0;font-weight:400}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair .stage{aspect-ratio:1/1;min-height:0}
.pcap{font-size:14px;margin-top:6px;display:grid;gap:2px}
.pcap b{font-family:var(--f-head);font-size:16px}
.imf{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--surface);width:fit-content}
.imf.hb{background:var(--orange)}.imf.dd{background:var(--teal)}.imf.ldf{background:var(--slate)}
.cer{display:grid;gap:8px;margin-top:12px}
.cer div{border-left:4px solid var(--teal);padding:2px 0 2px 12px;text-wrap:pretty}
.cer b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink)}
.bars{display:grid;gap:4px}
.brow{display:grid;grid-template-columns:150px minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13.5px}
.brow .bar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden}
.brow .bar i{display:block;height:100%}
.brow.on{font-weight:700}
.brow.on .bar{outline:2px solid var(--ink)}
.brow b{font-family:var(--f-mono);font-weight:500;text-align:right;font-size:12.5px}
.rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.rkc{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:grid;gap:3px}
.rkc:hover:not(:disabled){border-color:var(--orange)}
.rkc[data-r]{border-color:var(--teal);background:var(--teal-soft)}
.rkc .rn{font:700 20px var(--f-head);color:var(--teal-ink);min-height:1.2em}
.rkc.ok{border-color:var(--good);background:var(--good-soft)}.rkc.no{border-color:var(--bad);background:var(--bad-soft)}
.rkc:disabled{cursor:default}
.slrow{display:grid;grid-template-columns:140px minmax(0,1fr) 120px;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.slrow input{width:100%;accent-color:var(--orange)}
.meter{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--teal);transition:width .35s}
.readout{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:10px;text-wrap:pretty}
.verdict{display:inline-block;font-weight:700;padding:2px 10px;border-radius:6px;font-size:14.5px}
.verdict.yes{background:var(--good-soft);color:var(--good)}.verdict.no{background:var(--bad-soft);color:var(--bad)}.verdict.part{background:var(--orange-soft);color:var(--orange-ink)}
.segs{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.segs .btn{border:0;border-radius:0;background:transparent;border-right:1px solid var(--line)}
.segs .btn:last-child{border-right:0}
.segs .btn[aria-pressed="true"]{background:var(--orange);color:var(--on-orange)}
.ladder{display:grid;gap:4px;margin:10px 0}
.ladder button{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(60px,1.2fr);gap:8px;align-items:center;text-align:left;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.ladder button[aria-pressed="true"]{border-color:var(--orange);background:var(--orange-soft)}
.ladder .bar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.ladder .bar i{display:block;height:100%;background:var(--orange)}

const NS=STATIONS.length,N=STATIONS.filter(s=>!s.noDone).length,cum=[];STATIONS.reduce((a,m,i)=>(cum[i]=a+m.min),0);
const state={cur:0,done:new Set()};
const secs=[],steppers=[];
const needQ=STATIONS.map(m=>(m.tasks||[]).reduce((a,t)=>a+t.qs.length,0)),solvedQ=STATIONS.map(()=>0);
const stage=document.getElementById('stage'),rail=document.getElementById('rail');
const info={name:'',period:'',date:'',locked:false};
const SAVE_KEY='ap_chem_organic_s1_v1';
const QREG=[],PERSIST={};let curSt=0,QN=0,restoring=false,saveTimer=null,celebrated=false,saveNote='',practiceStat={ans:0,cor:0,tot:0};
const reg=(k,get,set)=>{PERSIST[k]={get,set}};

/* ---------- rail, completion control, progress ---------- */
function paintRail(){
  [...rail.children].forEach((b,i)=>{
    const done=state.done.has(i);
    b.classList.toggle('done',done);
    b.setAttribute('aria-current',i===state.cur?'true':'false');
    b.querySelector('.stop-n').innerHTML=done?IC.check:i;
    b.querySelector('.stop-t').textContent=STATIONS[i].noDone?'download PDF':(done?'complete':'about '+STATIONS[i].min+' min');
  });
  const n=state.done.size,pc=Math.round(n/N*100);
  document.getElementById('sbTxt').innerHTML='<b>'+n+'</b> of '+N+' stations complete';
  document.getElementById('sbF').style.width=pc+'%';document.getElementById('sbPct').textContent=pc+'%';
  if(state.cur===REP&&document.getElementById('rep'))renderReport();
}
function updDone(i){
  const bar=secs[i]&&secs[i].querySelector('.donebar');if(!bar)return;
  const d=state.done.has(i),m=STATIONS[i];
  bar.classList.toggle('on',d);
  bar.querySelector('.dn-t').textContent=d?'✓ Station '+i+' complete':'Station '+i+' not complete yet';
  bar.querySelector('.dn-s').textContent=m.manual?'Mark it complete when you have finished the questions you chose.':(needQ[i]?solvedQ[i]+' of '+needQ[i]+' questions answered correctly. This station completes by itself when all are done, or you can mark it yourself.':'This station completes by itself when its checks are done, or you can mark it yourself.');
  const b=bar.querySelector('button');b.textContent=d?'Undo':'Mark station complete';b.className='btn '+(d?'':'btn-primary');
}
function setDone(i,v,auto){
  if(v)state.done.add(i);else state.done.delete(i);
  if(state.done.size<N)celebrated=false;
  paintRail();updDone(i);
  if(v&&auto&&secs[i]){const nb=secs[i].querySelector('.nextbtn');if(nb)nb.classList.add('pulse')}
  if(v&&state.done.size===N&&!celebrated&&!restoring){celebrated=true;showFinished()}
  scheduleSave();
}
function finish(i){if(!state.done.has(i))setDone(i,true,true)}
function showFinished(){
  const nm=info.locked?info.name:'';
  let m=(nm?nm+', you':'You')+' have completed all '+N+' stations.';
  if(practiceStat.ans)m+=' Practice questions answered: '+practiceStat.ans+' of '+practiceStat.tot+', correct on the first try: '+practiceStat.cor+'.';
  m+=info.locked?' Open Report and submit to download your PDF report.':' Add your name at the top of the page, then open Report and submit to download your PDF report.';
  document.getElementById('dmM').textContent=m;document.getElementById('dm').hidden=false;document.getElementById('dmOk').focus();
}
document.getElementById('dmOk').addEventListener('click',()=>{document.getElementById('dm').hidden=true});
function confirmDialog(title,msg,yesLabel,onYes,noLabel){
  const m=document.getElementById('cm');document.getElementById('cmT').textContent=title;document.getElementById('cmM').textContent=msg;
  const y=document.getElementById('cmY'),n=document.getElementById('cmN');y.textContent=yesLabel;n.textContent=noLabel||'Keep working';
  const close=()=>{m.hidden=true;y.onclick=n.onclick=null};
  y.onclick=()=>{close();onYes()};n.onclick=close;m.hidden=false;n.focus();
}

/* ---------- student name ---------- */
function setSaveStatus(s){saveNote=s;const e=document.getElementById('saveSt');if(e)e.textContent=s}
function buildWho(){
  const w=document.getElementById('who');w.innerHTML='';
  const hint=h('p','whohint');hint.setAttribute('aria-live','polite');
  if(info.locked){
    const s=h('span','whoname');s.textContent='👤 ';const b=h('b');b.textContent=info.name;s.append(b,' · '+info.period+' · '+info.date);
    const eb=h('button','btn','Edit');eb.type='button';eb.addEventListener('click',()=>{info.locked=false;buildWho();document.getElementById('stuName').focus();scheduleSave()});
    w.append(s,eb);
  }else{
    const n=h('input');n.id='stuName';n.placeholder='Full name';n.value=info.name;n.autocomplete='name';n.setAttribute('aria-label','Full name');
    const c=h('input');c.id='stuClass';c.placeholder='Class / period';c.value=info.period;c.setAttribute('aria-label','Class or period');
    const sv=h('button','btn btn-primary','Save name');sv.type='button';
    const lock=()=>{const a=n.value.trim(),b=c.value.trim();if(!a||!b){hint.textContent='Enter your name and class, then press Save name.';return}
      info.name=a;info.period=b;info.date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});info.locked=true;buildWho();scheduleSave()};
    sv.addEventListener('click',lock);[n,c].forEach(x=>{x.addEventListener('keydown',e=>{if(e.key==='Enter')lock()});x.addEventListener('input',()=>{info.name=n.value;info.period=c.value;hint.textContent=''})});
    w.append(n,c,sv);
  }
  const st=h('span','savest');st.id='saveSt';st.textContent=saveNote;
  const rs=h('button','btn btn-danger','Reset all');rs.type='button';rs.title='Clear all answers, progress and the saved name';rs.addEventListener('click',requestResetAll);
  const rp=h('button','btn btn-report','Report');rp.type='button';rp.title='Check your work and download your PDF report';rp.addEventListener('click',()=>go(REP));
  w.append(st,rp,rs,hint);
  if(state.cur===REP&&document.getElementById('rep'))renderReport();
}

/* ---------- autosave (this browser only) ---------- */
function snapshot(){
  if(!info.locked){const n=document.getElementById('stuName'),c=document.getElementById('stuClass');if(n)info.name=n.value;if(c)info.period=c.value}
  const ext={};Object.keys(PERSIST).forEach(k=>{try{ext[k]=PERSIST[k].get()}catch(e){}});
  return {v:1,ts:Date.now(),info:Object.assign({},info),cur:state.cur,done:[...state.done],
    q:QREG.map((r,i)=>({i,k:r.k,w:r.w.slice(),c:r.c})).filter(e=>e.w.length||e.c>=0),ext};
}
function hasProgress(sn){return !!sn&&((sn.info&&(sn.info.locked||(sn.info.name||'').trim()))||(sn.done||[]).length||(sn.q||[]).length)}
function saveNow(){
  if(restoring)return;
  try{const sn=snapshot();localStorage.setItem(SAVE_KEY,JSON.stringify(sn));const d=new Date(sn.ts),p=x=>String(x).padStart(2,'0');setSaveStatus('Saved '+p(d.getHours())+':'+p(d.getMinutes()))}
  catch(e){setSaveStatus('Not saved: browser storage is unavailable')}
}
function scheduleSave(){if(restoring)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,500)}
function clearSaved(){clearTimeout(saveTimer);try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
function loadSaved(){try{const r=localStorage.getItem(SAVE_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function restoreFrom(sn){
  restoring=true;
  try{
    Object.assign(info,{name:'',period:'',date:'',locked:false},sn.info||{});buildWho();
    (sn.q||[]).forEach(e=>{const r=QREG[e.i];if(!r||r.k!==e.k)return;e.w.forEach(w=>{if(r.bs[w])r.bs[w].click()});if(e.c>=0&&r.bs[e.c])r.bs[e.c].click()});
    Object.keys(sn.ext||{}).forEach(k=>{if(PERSIST[k])try{PERSIST[k].set(sn.ext[k])}catch(e){}});
  }finally{restoring=false}
  state.done.clear();(sn.done||[]).forEach(i=>{if(i>=0&&i<N)state.done.add(i)});celebrated=state.done.size===N;
  paintRail();STATIONS.forEach((_,i)=>updDone(i));go(Math.min(NS-1,Math.max(0,sn.cur||0)),true);
}
function showResume(sn){
  const nm=((sn.info&&sn.info.name)||'').trim(),d=new Date(sn.ts);
  document.getElementById('resumeT').textContent=nm?'Welcome back, '+nm+'!':'Welcome back!';
  document.getElementById('resumeP').textContent='Your saved work from '+d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' has been restored ('+state.done.size+' of '+N+' stations complete). Carry on where you left off, or press Reset all to start from the beginning.';
  document.getElementById('resume').hidden=false;
}
['input','change','click'].forEach(ev=>document.addEventListener(ev,scheduleSave,true));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow()});
window.addEventListener('pagehide',saveNow);
document.getElementById('resumeOk').addEventListener('click',()=>{document.getElementById('resume').hidden=true});
document.getElementById('resumeReset').addEventListener('click',()=>requestResetAll());

/* ---------- reset ---------- */
function teardown(){
  [...VIEWERS].forEach(v=>{try{v.destroy()}catch(e){}});
  stage.innerHTML='';rail.innerHTML='';state.done.clear();state.cur=0;secs.length=0;steppers.length=0;solvedQ.fill(0);QREG.length=0;QN=0;practiceStat={ans:0,cor:0,tot:0};
  Object.keys(PERSIST).forEach(k=>delete PERSIST[k]);FRQ_TA.length=0;lastPDF=null;
}
function resetAll(){
  clearSaved();teardown();Object.assign(info,{name:'',period:'',date:'',locked:false});celebrated=false;
  document.getElementById('resume').hidden=true;document.getElementById('dm').hidden=true;
  try{history.replaceState(null,'','#s0')}catch(e){}
  init(true);setSaveStatus('');buildWho();window.scrollTo(0,0);
}
function requestResetAll(){
  confirmDialog('Reset everything?','This clears all your answers, your progress and your saved name in this browser, so you can start again from the beginning.','Continue',
    ()=>confirmDialog('Are you absolutely sure?','All your work will be erased and cannot be recovered. You will start again at station 0.','Yes, reset all my work',resetAll,'No, keep my work'),
    'Keep my work');
}

/* ---------- report and export (PDF) ---------- */
const REP=STATIONS.length-1,FRQ_TA=[];
let lastPDF=null,lastPDFName='';
const SUBD2='₀₁₂₃₄₅₆₇₈₉';
const uni=s=>String(s).replace(/([A-Za-z\)])(\d+)/g,(m,a,d)=>a+d.split('').map(c=>SUBD2[+c]).join(''));
const pad2=n=>String(n).padStart(2,'0');
const safeName=n=>String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'Student';
function stStats(i){
  const qs=QREG.filter(r=>r.si===i);
  return {total:qs.length,solved:qs.filter(r=>r.c>=0).length,first:qs.filter(r=>r.c>=0&&r.w.length===0).length,done:state.done.has(i),qs};
}
function overallStats(){
  let t=0,s=0,f=0,c=0;for(let i=0;i<N;i++){const x=stStats(i);t+=x.total;s+=x.solved;f+=x.first;if(x.done)c++}
  const w=FRQ_TA.filter(e=>e.value.trim().length>=8).length;
  return {t,s,f,c,w,wt:FRQ_TA.length};
}
function missingList(){const m=[];for(let i=0;i<N;i++)if(!state.done.has(i))m.push('Station '+i+' ('+STATIONS[i].short+')');return m}
function renderReport(){
  const rep=document.getElementById('rep');if(!rep)return;
  const o=overallStats(),miss=missingList();
  let rows='';
  for(let i=0;i<N;i++){const x=stStats(i);
    rows+='<tr><td><b>Station '+i+'</b><br><span class="pnote">'+STATIONS[i].short+'</span></td><td>'+(x.total?x.solved+' / '+x.total:'<span class="pnote">no questions</span>')+'</td><td>'+(x.total?x.first:'')+'</td><td><span class="verdict '+(x.done?'yes':'part')+'">'+(x.done?'Complete':'Not finished')+'</span></td><td><button type="button" class="btn" data-go="'+i+'">Go</button></td></tr>';}
  rep.innerHTML='<p class="brief">The report is a PDF with your name, which stations you finished, every question you answered and the free-response answers you typed. <b>You can submit at any time.</b> If some stations are not finished, the report is marked incomplete and lists what is missing.</p>'+
   '<div class="tablewrap" style="margin:14px 0"><table style="min-width:520px"><thead><tr><th>Station</th><th>Questions answered correctly</th><th>Correct on first try</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<p class="pnote">Free-response answers typed: <b>'+o.w+' of '+o.wt+'</b>. A station is complete when you mark it complete or answer all its questions correctly.</p>'+
   '<div id="rep-box" style="margin:14px 0">'+(!info.locked?'<div class="readout" style="border-left:4px solid var(--warn)"><b>Save your name first.</b> Enter your name and class at the top of the page and press Save name. They are printed on the report.</div>':miss.length?'<div class="readout" style="border-left:4px solid var(--warn)"><b>Not finished yet:</b> '+miss.join(', ')+'. You can still make the report. It will say the work is incomplete.</div>':'<div class="readout" style="border-left:4px solid var(--good)"><b>Everything is complete.</b> You can make your report now.</div>')+'</div>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button type="button" class="btn btn-primary" id="rep-go"'+(info.locked?'':' disabled')+'>Finish and download my report (PDF)</button><button type="button" class="btn" id="rep-again"'+(lastPDF?'':' hidden')+'>Download again</button></div>'+
   '<div id="rep-conf" hidden></div><p class="pnote" style="margin-top:10px">Remember to send the downloaded PDF to your teacher.</p><p class="readout" id="rep-note" hidden></p>';
  rep.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
  document.getElementById('rep-go').addEventListener('click',()=>{const m=missingList();if(!m.length)makeReport();else repConfirm(m)});
  document.getElementById('rep-again').addEventListener('click',()=>{if(lastPDF)savePDF().then(r=>repNote(r))});
}
function repNote(r){
  const n=document.getElementById('rep-note');if(!n)return;n.hidden=false;
  n.textContent=r==='declined'?'The download was cancelled. Press “Download again” when you are ready.':'Your report was saved as '+lastPDFName+'. Send it to your teacher. If nothing downloaded, press “Download again” or check your browser’s download settings.';
}
function repConfirm(miss){
  const c=document.getElementById('rep-conf');c.hidden=false;c.innerHTML='';
  const box=h('div','readout');box.style.cssText='border-left:4px solid var(--warn);margin-top:12px';
  box.innerHTML='<b>Your work is not finished</b> ('+miss.join(', ')+'). The report will be marked INCOMPLETE. Make it anyway?';
  const row=h('div');row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:10px';
  const no=h('button','btn','Keep working'),yes=h('button','btn btn-primary','Yes, make my report');no.type=yes.type='button';
  no.addEventListener('click',()=>{c.hidden=true;c.innerHTML=''});yes.addEventListener('click',()=>{c.hidden=true;c.innerHTML='';makeReport()});
  row.append(no,yes);box.append(row);c.append(box);no.focus();
}
function buildPDF(){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  doc.addFileToVFS('DejaVuSans.ttf',FONT_REG);doc.addFont('DejaVuSans.ttf','DejaVu','normal');
  doc.addFileToVFS('DejaVuSans-Bold.ttf',FONT_BOLD);doc.addFont('DejaVuSans-Bold.ttf','DejaVu','bold');
  const M=14,W=210-2*M,PH=297;let y=M;
  const INK=[18,37,61],GREEN=[21,128,61],RED=[180,35,24],GREY=[80,96,120],TEAL=[11,127,131];
  const set=(st,sz,col)=>{doc.setFont('DejaVu',st);doc.setFontSize(sz);doc.setTextColor(col[0],col[1],col[2])};
  const step=sz=>sz*0.3528*1.42,need=hh=>{if(y+hh>PH-16){doc.addPage();y=M}};
  function para(t,x,w,st,sz,col){set(st,sz,col);doc.splitTextToSize(uni(t),w).forEach(l=>{need(step(sz));doc.text(l,x,y+sz*0.3528);y+=step(sz)})}

function buildStepper(ex){
  const mol=getMol({smi:ex.smi,opts:ex.opts}),steps=ex.steps;
  const root=h('div','ex'),left=h('div'),right=h('div');
  const stg=h('div','stage'),cv=h('canvas');
  stg.append(cv,h('span','stage-hint','Drag to rotate · double-click to reset'));
  const tools=h('div','stage-tools'),bLab=h('button','mini','Labels');bLab.type='button';bLab.setAttribute('aria-pressed','true');tools.append(bLab);stg.append(tools);
  const kit=h('div','kitbar');left.append(stg,kit);
  const list=h('ol','steps');
  const btns=steps.map((s,k)=>{const li=h('li'),b=h('button','step');b.type='button';
    b.innerHTML='<span class="step-n">'+(k+1)+'</span><span class="step-t">'+T(s.t)+'</span><span class="step-d">'+T(s.d)+'</span>';
    b.addEventListener('click',()=>{pause();goStep(k)});li.appendChild(b);list.appendChild(li);return b});
  const ctr=h('div','ctrls');
  const bPrev=h('button','btn',IC.prev+'Back'),bPlay=h('button','btn btn-primary'),bNext=h('button','btn','Next'+IC.next),bRe=h('button','btn',IC.replay+'Restart');
  [bPrev,bPlay,bNext,bRe].forEach(b=>b.type='button');ctr.append(bPlay,bPrev,bNext,bRe);right.append(list,ctr);root.append(left,right);
  const v=new Viewer(cv,mol,{label:'3D model: '+ex.title});
  let k=0,timer=null;
  const gl=i=>mol.atoms.reduce((a,x,j)=>(x.hOf===i&&a.push(j),a),[]);
  const visList=upto=>{const out=[],seen=new Set(),add=i=>{if(!seen.has(i)){seen.add(i);out.push(i)}};
    for(let s=0;s<=upto;s++){(steps[s].heavy||[]).forEach(add);(steps[s].h||[]).forEach(o=>gl(o).forEach(add))}return out};
  function paintKit(vis){
    const set=new Set(vis),cnt={};vis.forEach(i=>{const e=mol.atoms[i].el;cnt[e]=(cnt[e]||0)+1});
    let single=0,dbl=0,trip=0;
    mol.bonds.forEach(b=>{if(set.has(b.a)&&set.has(b.b)){if(b.o===1)single++;else if(b.o===2)dbl++;else if(b.o===3)trip++}});
    kit.innerHTML='<span class="cap">Used so far</span>'+invHTML({atoms:cnt,single,dbl,trip});
  }
  function goStep(i,instant){
    k=Math.max(0,Math.min(steps.length-1,i));const s=steps[k],vis=visList(k);
    v.show(vis,instant);v.hl=new Set(s.hl||[]);v.tag=s.tag||null;
    v.cam=s.cam?[s.cam[0]*Math.PI/180,s.cam[1]*Math.PI/180]:null;
    btns.forEach((b,j)=>{b.classList.toggle('cur',j===k);b.classList.toggle('past',j<k);if(j===k)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
    bPrev.disabled=k===0;bNext.disabled=k===steps.length-1;paintKit(vis);
  }
  function pause(){if(timer){clearInterval(timer);timer=null}bPlay.innerHTML=IC.play+'Auto-play'}
  function play(){
    if(k>=steps.length-1){v.show([],true);goStep(0)}
    bPlay.innerHTML=IC.pause+'Stop';
    timer=setInterval(()=>{if(!stg.offsetParent||k>=steps.length-1){pause();return}goStep(k+1)},3200);
  }
  bPlay.addEventListener('click',()=>(timer?pause():play()));
  bPrev.addEventListener('click',()=>{pause();goStep(k-1)});bNext.addEventListener('click',()=>{pause();goStep(k+1)});
  bRe.addEventListener('click',()=>{pause();v.show([],true);goStep(0);play()});
  bLab.addEventListener('click',()=>{v.labels=!v.labels;bLab.setAttribute('aria-pressed',String(v.labels))});
  pause();goStep(0);
  return {root,v,stop:pause,reset(){pause();v.show([],true);goStep(0);v.yaw=v.home[0];v.pitch=v.home[1]}};
}

function skelSVG(d,showH){
  const [,,W,H]=d.vb;let s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Skeletal structure of '+d.n+'">';
  d.b.forEach(([i,j,o])=>{
    const p=d.a[i],q=d.a[j];let x1=p[0],y1=p[1],x2=q[0],y2=q[1];
    const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,nx=-uy,ny=ux;
    const sh=e=>e[2]!=='C'?12:(showH?9:0);
    x1+=ux*sh(p);y1+=uy*sh(p);x2-=ux*sh(q);y2-=uy*sh(q);
    const offs=o===1?[0]:o===2?[-2.6,2.6]:[-3.6,0,3.6];
    offs.forEach(f=>{s+='<line x1="'+(x1+nx*f).toFixed(1)+'" y1="'+(y1+ny*f).toFixed(1)+'" x2="'+(x2+nx*f).toFixed(1)+'" y2="'+(y2+ny*f).toFixed(1)+'" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>'});
  });
  d.a.forEach((p,i)=>{
    if(p[2]!=='C'){
      const col=p[2][0]==='N'?'var(--blue)':'var(--red)';
      s+='<text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="15" font-weight="700" fill="'+col+'">'+p[2]+'</text>';
    }else if(showH){
      let used=0;d.b.forEach(([a,b,o])=>{if(a===i||b===i)used+=o});const hc=4-used;
      s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="11" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="'+p[0]+'" y="'+(p[1]+3.5)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--ink)">'+(hc?'CH'+(hc>1?subU(hc):''):'C')+'</text>';
    }
  });
  return s+'</svg>';
}

 MQ('1.3',[],'A pure compound contains 40.0% carbon, 6.7% hydrogen and 53.3% oxygen by mass. What is its empirical formula?',['CH₂O','CHO','C₂H₄O','CH₃O'],0,'In 100 g: C 3.33 mol, H 6.65 mol, O 3.33 mol. Dividing by 3.33 gives a 1 : 2 : 1 ratio, so CH₂O.'),
 MQ('1.3',['ethanoic'],'What is the mass percent of oxygen in ethanoic acid, CH₃COOH? (Molar mass = 60 g/mol)',['53.3%','26.7%','40.0%','66.7%'],3,'Two O atoms: 2 × 16.0 = 32.0 g/mol. 32.0 ÷ 60 × 100 = 53.3%. (40.0% is the carbon percentage.)'),
 MQ('1.5',[],'Which is the ground-state electron configuration of an oxygen atom?',['1s² 2s² 2p⁴','1s² 2s² 2p⁶','1s² 2s¹ 2p⁵','1s² 2s² 2p³ 3s¹'],0,'Oxygen has 8 electrons: 2 in 1s, 2 in 2s and 4 in 2p. The other options have the wrong total or an excited-state arrangement.'),
 MQ('1.6',[],'A photoelectron spectrum of a neutral atom shows peaks at binding energies of 104, 6.84, 3.67 and 0.50 MJ/mol, with relative intensities 2 : 2 : 6 : 1. Which element gives this spectrum?',['Sodium','Magnesium','Neon','Aluminium'],2,'The intensities show 1s², 2s², 2p⁶ and 3s¹, which is 11 electrons: sodium. Magnesium would have a 3s peak of intensity 2, neon would have no 3s peak, and aluminium would also show a 3p peak.'),
 MQ('1.7',[],'The first ionization energy of oxygen (1314 kJ/mol) is lower than that of nitrogen (1402 kJ/mol), even though oxygen has more protons. Which is the best explanation?',['In oxygen, two electrons share one 2p orbital and repel each other, so one is easier to remove.','Oxygen has a larger atomic radius because it has more energy levels.','Nitrogen has more electrons in its inner shells that shield the outer electrons.','Oxygen has a lower effective nuclear charge than nitrogen.'],1,'Both atoms remove a 2p electron from the same shell. In N each 2p orbital holds one electron. In O one 2p orbital holds a pair, and the electron–electron repulsion makes it easier to remove.'),
 MQ('1.8',[],'Calcium and nitrogen react to form an ionic compound. What is its formula?',['Ca₃N₂','CaN','Ca₂N₃','Ca₃N'],2,'Calcium forms Ca²⁺ and nitrogen forms N³⁻. Charges balance with 3 Ca²⁺ (+6) and 2 N³⁻ (−6): Ca₃N₂.'),
 /* ---- Unit 2 ---- */
 MQ('2.1',['ethanol'],'Which bond in ethanol, CH₃CH₂OH, is the most polar? (Electronegativities: H 2.1, C 2.5, O 3.5)',['O–H','C–O','C–H','C–C'],2,'O–H has the largest electronegativity difference (1.4). C–O is 1.0, C–H is 0.4 and C–C is 0.'),
 MQ('2.1',['ethane','ethene','ethyne'],'Which has the shortest carbon–carbon bond and the highest bond energy?',['Ethyne','Ethene','Ethane','They are all equal'],1,'More bonding pairs hold the carbons closer and make the bond stronger: C≡C is about 120 pm and 839 kJ/mol.'),
 MQ('2.3',[],'Magnesium oxide, MgO, melts at 2852 °C and sodium chloride, NaCl, melts at 801 °C. Which statement best explains why MgO melts so much higher?',['The ions in MgO have larger charges and are smaller, so Coulombic attractions in the lattice are much stronger.','MgO has covalent bonds and NaCl has ionic bonds.','MgO has a larger molar mass, so it has stronger London dispersion forces.','MgO has delocalized electrons that NaCl lacks.'],0,'Coulomb’s law: force is proportional to q₁q₂/r². Mg²⁺ and O²⁻ have 2+ and 2− charges and shorter distances than Na⁺ and Cl⁻, so far more energy is needed to separate the ions.'),
 MQ('2.4',[],'Steel is an alloy of iron with a small amount of carbon. It is harder than pure iron mainly because',['small carbon atoms fit between iron atoms and keep layers of iron atoms from sliding past each other.','carbon atoms replace iron atoms of similar size in the lattice.','iron and carbon form a network covalent solid.','carbon atoms donate electrons to form ionic bonds with iron.'],3,'Steel is an interstitial alloy. The small C atoms occupy spaces between larger Fe atoms and block layer movement.'),
 MQ('2.5',['ethanoic'],'How many lone pairs of electrons are in a complete Lewis diagram of ethanoic acid, CH₃COOH?',['4','2','3','6'],0,'Total valence electrons: 2(4) + 4(1) + 2(6) = 24. The 8 bonding pairs use 16 e⁻, leaving 8 e⁻ as 4 lone pairs: 2 on the carbonyl O and 2 on the –OH oxygen.'),
 MQ('2.6',[],'What is the formal charge on the nitrogen atom in the nitrate ion, NO₃⁻, in a Lewis structure with one N=O bond and two N–O⁻ bonds?',['+1','0','−1','+2'],2,'Formal charge = valence electrons − nonbonding electrons − bonds = 5 − 0 − 4 = +1.'),
 MQ('2.7',['propene'],'How many σ and π bonds are in propene, CH₂=CH–CH₃?',['8 σ and 1 π','7 σ and 2 π','9 σ and 0 π','6 σ and 3 π'],0,'C=C is 1σ + 1π, C–C is 1σ and the six C–H bonds are σ: 8σ and 1π.'),
 MQ('2.7',['propanone'],'In propanone, CH₃COCH₃, what is the approximate C–C(=O)–C angle and the hybridization of the carbonyl carbon?',['120°, sp²','109.5°, sp³','180°, sp','90°, sp²'],1,'The carbonyl carbon has 3 electron domains: trigonal planar, sp², about 120°.'),
 MQ('2.7',['methylamine'],'In methylamine, CH₃NH₂, what are the hybridization of the nitrogen atom and the shape of the molecule around nitrogen?',['sp³, trigonal pyramidal (H–N–H angle about 107°)','sp², trigonal planar (120°)','sp³, tetrahedral (109.5°)','sp, linear (180°)'],0,'Nitrogen has 3 bonded atoms and 1 lone pair: 4 electron domains, so sp³. The lone pair is not part of the molecular shape, which is trigonal pyramidal.'),
 MQ('2.7',['nitrile'],'What are the hybridizations of the two carbon atoms in ethanenitrile, CH₃CN? (The CH₃ carbon is listed first.)',['sp³, sp','sp³, sp²','sp², sp','sp³, sp³'],2,'The CH₃ carbon has 4 single bonds: sp³. The nitrile carbon has 2 electron domains (one C–C, one C≡N): sp, so the C–C≡N unit is linear.'),
 /* ---- Unit 3 ---- */
 MQ('3.1',['ethanol','dme'],'Ethanol, CH₃CH₂OH, boils at 78 °C and dimethyl ether, CH₃OCH₃, at −24 °C. Which statement best explains the difference?',['Ethanol molecules hydrogen-bond to each other, but dimethyl ether molecules cannot.','Ethanol has stronger covalent bonds than dimethyl ether.','Dimethyl ether is nonpolar, so it has no intermolecular forces.','Ethanol has a larger molar mass, which is the only factor.'],2,'Both have the formula C₂H₆O. Ethanol has an O–H bond, so its molecules form hydrogen bonds. Boiling overcomes IMFs, not covalent bonds.'),
 MQ('3.1',['pentane','neopentane'],'Pentane boils at 36 °C and 2,2-dimethylpropane at 9.5 °C. They have the same formula. Which explanation is best?',['2,2-Dimethylpropane is more compact, with less surface contact and weaker London dispersion forces.','Pentane is polar and 2,2-dimethylpropane is not.','2,2-Dimethylpropane forms hydrogen bonds.','Pentane has a smaller molar mass.'],1,'Both are nonpolar with equal molar mass and electrons. The compact shape lowers contact area and the dispersion forces.'),
 MQ('3.1',['ethanoic','mformate'],'Ethanoic acid and methyl methanoate (HCOOCH₃) have the same formula, but the ester boils far lower. Why?',['The ester has no O–H, so its molecules cannot hydrogen-bond to each other.','The ester is nonpolar.','The ester has fewer electrons.','The ester has weaker C=O bonds.'],3,'Hydrogen bonding requires H bonded to O, N or F. The ester has none, so it has only dipole–dipole forces.'),
 MQ('3.1',['propane','dme','ethanol','ethanoic'],'Which compound has only London dispersion forces between its molecules?',['Propane','Dimethyl ether','Ethanol','Ethanoic acid'],0,'Propane contains only C–C and C–H bonds, so it is nonpolar. The others have polar C–O or O–H bonds.'),
 MQ('3.2',['ethanoic'],'Solid ethanoic acid melts at 17 °C and does not conduct electricity. What type of solid is it?',['Molecular solid','Ionic solid','Network covalent solid','Metallic solid'],0,'Discrete molecules held together by intermolecular forces (hydrogen bonding) give a low melting point and no mobile charges.'),
 MQ('3.4',[],'A 2.0 L flask contains 0.10 mol of an ideal gas at 300 K. What is the pressure? (R = 0.0821 L·atm/(mol·K))',['1.2 atm','0.12 atm','2.5 atm','12 atm'],1,'P = nRT/V = (0.10)(0.0821)(300)/2.0 = 1.2 atm.'),
 MQ('3.5',[],'Samples of helium and neon gas are at the same temperature. Which statement is correct?',['Both gases have the same average kinetic energy, and helium atoms move faster on average.','Both gases have the same average speed.','Neon atoms have a greater average kinetic energy because they are heavier.','Helium atoms have a greater average kinetic energy because they are lighter.'],0,'Average kinetic energy depends only on temperature. With the same KE, the lighter He atoms must have a higher average speed.'),
 MQ('3.6',['methane','ammonia'],'At the same temperature and pressure, NH₃ deviates more from ideal-gas behavior than CH₄ does. Which is the best explanation?',['NH₃ molecules attract each other more strongly (hydrogen bonding), so the real pressure is lower than the ideal value.','NH₃ molecules have no volume.','CH₄ molecules are polar.','NH₃ has a lower molar mass than CH₄.'],0,'Stronger attractions reduce the force of collisions with the walls, so the real pressure is lower than ideal. CH₄ has only weak dispersion forces.'),
 MQ('3.9',['ethanol','ethanoic','propanone','pentane'],'In paper chromatography the paper is polar and the solvent is nonpolar. Which component of a mixture would move the farthest up the paper?',['Pentane','Ethanol','Ethanoic acid','Propanone'],3,'The least polar component is attracted least to the polar paper and most to the nonpolar solvent, so it travels farthest.'),
 MQ('3.10',['hexane'],'Iodine, I₂, dissolves much better in hexane, C₆H₁₄, than in water. Which statement best explains this?',['I₂ and hexane are both nonpolar and interact through London dispersion forces, while water’s strong hydrogen bonding excludes I₂.','I₂ forms hydrogen bonds with hexane.','Hexane is polar and I₂ is polar.','I₂ reacts with water to form ions.'],0,'Like dissolves like: nonpolar solute and nonpolar solvent have similar IMFs, so mixing is favourable.'),
 MQ('3.12',[],'A photon of ultraviolet light has a wavelength of 250 nm and a photon of visible light has a wavelength of 500 nm. What is the ratio of the energies, E(250 nm) : E(500 nm)?',['2 : 1','1 : 2','4 : 1','1 : 1'],0,'E = hc/λ. Half the wavelength means twice the photon energy.'),
 MQ('3.11',['ethanol','propanone','ethanoic','propanol'],'An infrared spectrum shows a strong absorption near 1715 cm⁻¹ and no broad absorption between 3200 and 3600 cm⁻¹. Which compound fits?',['Propanone','Ethanol','Ethanoic acid','Propan-1-ol'],0,'1715 cm⁻¹ indicates a C=O bond. The absence of a broad O–H band rules out the alcohols and the acid. IR absorption corresponds to molecular vibrations (Topic 3.11).'),
 MQ('3.13',[],'A solution has an absorbance of 0.40 at a concentration of 0.010 M. A second solution of the same species, measured in the same cell at the same wavelength, has an absorbance of 0.60. What is its concentration?',['0.015 M','0.0067 M','0.012 M','0.024 M'],3,'A = εbc with ε and b constant, so A is proportional to c: 0.010 × (0.60/0.40) = 0.015 M.')
];
const FRQ=[
 {t:'Free response 1: chlorine and its compounds',u:'Unit 1',mols:['clacid'],
  q:['Chlorine has two naturally occurring isotopes. A mass spectrum of a chlorine sample shows peaks at m/z = 35 (relative abundance 75.8%) and m/z = 37 (relative abundance 24.2%).','(a) Calculate the average atomic mass of chlorine. Show your work.','(b) Write the ground-state electron configuration of a chlorine atom. The first ionization energy of sulfur is 1000 kJ/mol and that of chlorine is 1251 kJ/mol. Explain why chlorine has the higher value.','(c) The radius of the Cl⁻ ion (181 pm) is larger than that of the Cl atom (99 pm). Explain.','(d) Chloroethanoic acid, ClCH₂COOH (structure shown, molar mass 94.5 g/mol), is made from chlorine. Calculate its mass percent of chlorine.'],
  pts:['(a) (0.758)(35) + (0.242)(37) = 26.5 + 9.0 = 35.5 amu (35.48).','(b) 1s² 2s² 2p⁶ 3s² 3p⁵. In both atoms the electron is removed from the 3p subshell with similar shielding, but Cl has 17 protons versus 16 for S. The greater effective nuclear charge attracts the 3p electron more strongly, so more energy is needed to remove it.','(c) Cl⁻ has the same 17 protons as Cl but 18 electrons. The added electron increases electron–electron repulsion while the nuclear attraction stays the same, so the electron cloud expands.','(d) % Cl = 35.45 ÷ 94.5 × 100 = 37.5%.']},
 {t:'Free response 2: ionic solids, metals and alloys',u:'Unit 2',
  q:['Magnesium oxide, MgO, melts at 2852 °C and sodium chloride, NaCl, melts at 801 °C. The radius of Mg²⁺ is 72 pm and the radius of Na⁺ is 102 pm.','(a) Use Coulomb’s law to explain why MgO has a much higher melting point than NaCl.','(b) Solid MgO does not conduct electricity, but molten MgO does. Explain this difference at the particle level.','(c) Solid magnesium metal conducts electricity. Explain using the model of metallic bonding.','(d) Steel is an alloy of iron with a small amount of carbon. Identify the type of alloy and explain why steel is harder than pure iron.'],
  pts:['(a) Coulomb’s force is proportional to q₁q₂/r². MgO has ions with charges of 2+ and 2− compared with 1+ and 1− in NaCl, and the Mg²⁺ and O²⁻ ions are smaller, so the distance r is shorter. The ion–ion attractions (lattice energy) are much greater, so far more energy is needed to separate the ions.','(b) In the solid the ions are fixed in the lattice and there are no mobile charge carriers. In the molten state the ions are free to move and carry charge.','(c) Metal atoms release valence electrons into a delocalized “sea” around fixed positive ions. These mobile electrons can move and carry charge.','(d) Interstitial alloy. The small carbon atoms fit into spaces between the larger iron atoms and disrupt the regular layers, so the layers cannot slide past each other easily, making the material harder.']},
 {t:'Free response 3: ethanenitrile',u:'Unit 2',rm:['nitrile'],
  q:['Ethanenitrile, CH₃CN, is a polar organic solvent.','(a) Draw a complete Lewis diagram for CH₃CN. Show all lone pairs.','(b) State the hybridization of each carbon atom and the approximate H–C–C and C–C–N bond angles.','(c) How many σ bonds and how many π bonds are in one molecule of CH₃CN?','(d) The C–N bond length in CH₃CN is 116 pm. A typical C–N single bond is 147 pm. Explain this difference.'],
  pts:['(a) H₃C–C≡N: three C–H bonds, one C–C bond, a C≡N triple bond and one lone pair on N (16 valence electrons in total).','(b) CH₃ carbon: four electron domains, sp³, H–C–C ≈ 109.5°. Nitrile carbon: two electron domains, sp, C–C–N = 180°.','(c) 5 σ bonds (3 C–H, 1 C–C, 1 C–N) and 2 π bonds (both in the C≡N bond).','(d) The C≡N bond has three shared electron pairs. The greater electron density between the nuclei pulls them closer together, so the bond is shorter (and stronger) than a single bond.']},
 {t:'Free response 4: ethanol and dimethyl ether',u:'Units 2 and 3',mols:[],rm:['ethanol','dme'],
  q:['Ethanol (boiling point 78 °C) and dimethyl ether (−24 °C) both have the molecular formula C₂H₆O.','(a) Draw a Lewis structure for each, showing lone pairs.','(b) Explain the difference in boiling points in terms of intermolecular forces.','(c) Which is more soluble in water? Justify using particle-level interactions.'],
  pts:['(a) CH₃–CH₂–O–H and CH₃–O–CH₃, each with two lone pairs on oxygen, and bent about O.','(b) Ethanol has an O–H bond, so its molecules hydrogen-bond with each other. Dimethyl ether is polar but has no O–H, so it has only dipole–dipole and dispersion forces. More energy is needed to separate ethanol molecules, so its boiling point is higher.','(c) Ethanol is more soluble (miscible). It can donate and accept hydrogen bonds with water, replacing water–water and ethanol–ethanol hydrogen bonds with similar ones. Dimethyl ether can only accept hydrogen bonds from water, and its two CH₃ groups limit solubility.']},
 {t:'Free response 5: gases, methane and ammonia',u:'Unit 3',mols:['methane','ammonia'],
  q:['A rigid 4.00 L container holds 1.00 g of methane gas, CH₄ (molar mass 16.04 g/mol), at 300. K. Assume ideal behavior. (R = 0.08206 L·atm/(mol·K))','(a) Calculate the pressure of the gas in atm.','(b) The container is heated to 450. K. Use kinetic molecular theory to explain why the pressure increases, and calculate the new pressure.','(c) Methane and ammonia (both shown) have similar molar masses. At 300 K and high pressure, NH₃ deviates much more from ideal behavior than CH₄. Explain with reference to intermolecular forces.','(d) State one other reason why real gases deviate from ideal behavior at very high pressure.'],
  pts:['(a) n = 1.00 g ÷ 16.04 g/mol = 0.0623 mol. P = nRT/V = (0.0623)(0.08206)(300)/4.00 = 0.383 atm.','(b) Higher temperature means a higher average kinetic energy, so molecules move faster and collide with the walls more often and with greater force. P₂ = 0.383 × (450/300) = 0.575 atm (P is proportional to T at constant n and V).','(c) NH₃ molecules hydrogen-bond, so they attract one another strongly. These attractions reduce the force and frequency of wall collisions, so the real pressure is lower than the ideal value. CH₄ is nonpolar and has only weak London dispersion forces, so it behaves closer to ideal.','(d) At high pressure the gas molecules are close together and the volume of the molecules themselves is no longer negligible compared with the container volume.']},
 {t:'Free response 6: spectrophotometry and solubility',u:'Unit 3',mols:['ethanol','hexanol'],
  q:['A student measures the absorbance of aqueous copper(II) sulfate solutions at the wavelength of maximum absorbance using a cell with a path length of 1.00 cm. A 0.0100 M solution has an absorbance of 0.120.','(a) Calculate the molar absorptivity, ε, of the solution, including units.','(b) An unknown solution has an absorbance of 0.180 under the same conditions. Determine its concentration.','(c) Explain why the student uses the wavelength of maximum absorbance.','(d) Ethanol and hexan-1-ol (both shown) each contain an –OH group. Ethanol is miscible with water, but hexan-1-ol dissolves only about 0.6 g per 100 g of water. Explain using particle-level interactions.'],
  pts:['(a) ε = A/(bc) = 0.120 ÷ (1.00 cm × 0.0100 M) = 12.0 L/(mol·cm), or 12.0 M⁻¹cm⁻¹.','(b) c = A/(εb) = 0.180 ÷ (12.0 × 1.00) = 0.0150 M.','(c) At the wavelength of maximum absorbance the solution absorbs most strongly, so a small change in concentration gives the largest change in absorbance (greatest sensitivity).','(d) Both molecules can form hydrogen bonds with water through the –OH group. Ethanol’s small ethyl group disrupts water’s hydrogen-bond network very little, so the hydrogen bonding wins. The six-carbon nonpolar tail of hexan-1-ol interacts with water only through weak London dispersion forces and breaks water–water hydrogen bonds, so the nonpolar tail outweighs the –OH head and solubility is low.']}
];
function buildPractice(si){
  const frag=[];let ans=0,cor=0;
  const bar=h('div','scorebar');const upd=()=>{bar.innerHTML='<span>Answered <b>'+ans+'</b> of '+MCQ.length+' · Correct on the first try <b>'+cor+'</b></span><span class="pnote">'+MCQ.length+' multiple-choice questions and '+FRQ.length+' free-response tasks, grouped by unit. Choose a set for class and use the rest for homework.</span>'};
  practiceStat.tot=MCQ.length;upd();frag.push(bar);
  reg('frq',()=>FRQ_TA.map(e=>e.value),v=>{(v||[]).forEach((x,i)=>{if(FRQ_TA[i])FRQ_TA[i].value=x})});
  let num=0;
  UNITS.forEach(([un,ut])=>{
    const list=MCQ.map((q,i)=>[q,i]).filter(([q])=>q.u[0]===un);
    const card=h('article','card'),hd=h('div','card-h');hd.append(h('span','tag','Multiple choice'),h('h3',null,ut));
    const qs=h('div','qs');
    list.forEach(([q,i])=>{num++;const w=h('div');w.append(h('p','pnote','Question '+num+' · Topic '+q.u));
      const node=buildQ(q,wr=>{ans++;if(wr===0)cor++;practiceStat.ans=ans;practiceStat.cor=cor;upd()});
      w.append(node);qs.append(w)});
    card.append(hd,qs);frag.push(card);
  });
  FRQ.forEach(f=>{
    const c=h('article','card'),ch=h('div','card-h');ch.append(h('span','tag','Free response · '+f.u),h('h3',null,f.t));
    const m=h('div','model');m.hidden=true;m.innerHTML='<b>Scoring points</b><ul>'+f.pts.map(p=>'<li>'+T(p)+'</li>').join('')+'</ul>';
    if(f.rm){m.append(h('p','pnote','Structures for the drawing part:'),structRow(f.rm))}
    const b=h('button','btn','Show scoring points');b.type='button';b.addEventListener('click',()=>{m.hidden=!m.hidden;b.textContent=m.hidden?'Show scoring points':'Hide scoring points'});
    c.append(ch);f.q.forEach(p=>{const e=h('p','brief',T(p));e.style.marginBottom='8px';c.append(e)});
    if(f.mols&&f.mols.length)c.append(structRow(f.mols));
    const ta=h('textarea','frqta');ta.rows=5;ta.placeholder='Type your answer here (optional). It is saved and included in your report.';ta.setAttribute('aria-label','Your answer to '+f.t);ta.dataset.t=f.t;FRQ_TA.push(ta);c.append(ta);
    c.append(h('p','pnote','Write your answer first, then check each scoring point. Build the molecules in the kit if you need to see the geometry.'),b,m);frag.push(c);
  });
  const ex=h('article','card');ex.innerHTML='<div class="card-h"><span class="tag">Exit ticket</span><h3>Before you leave</h3></div><ol class="steps" style="padding-left:20px;display:grid;gap:6px"><li>Draw skeletal structures of ethanol, dimethyl ether and ethanoic acid from memory. Label every functional group.</li><li>Write one sentence that ranks the three by boiling point and names the strongest IMF in each.</li><li>Name one structural feature that makes a carbon sp³, sp² or sp, with an example from today.</li></ol>';
  frag.push(ex);return frag;
}

const SKC=['CH₃CH(OH)CH₂CH₂CH₃','CH₃CH₂COCH₃','CH₃CH₂COOH','CH₃COOCH₂CH₃','CH₃C≡CCH₂CH₃','CH₃CH(NH₂)CH₂CH₃'];
function buildFound(){
  const frag=[];
  const a=h('article','card');
  a.innerHTML='<div class="card-h"><span class="tag">Idea 1</span><h3>Backbone plus functional group</h3></div>';
  const ex=h('div','ex'),L=h('div'),R=h('div'),stg=h('div','stage'),cv=h('canvas');stg.append(cv);L.append(stg);
  const mol=getMol({smi:'CCO'});const v=new Viewer(cv,mol,{showAll:true,label:'3D model of ethanol, backbone and functional group'});
  const grp=new Set([2]);mol.atoms.forEach((x,i)=>{if(x.hOf===2)grp.add(i)});
  const bk=new Set();mol.atoms.forEach((x,i)=>{if(!grp.has(i))bk.add(i)});
  const seg=h('div','segs');seg.style.marginTop='10px';
  [['Show backbone',bk],['Show functional group',grp]].forEach(([lab,set],k)=>{const b=h('button','btn',lab);b.type='button';b.setAttribute('aria-pressed',String(k===1));
    b.addEventListener('click',()=>{v.hl=set;[...seg.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});seg.append(b)});
  v.hl=grp;L.append(seg);
  R.innerHTML='<ul style="margin:0;padding-left:20px;display:grid;gap:8px"><li><b>Carbon makes 4 bonds</b>, so it builds chains, branches and rings. This chain is the <b>backbone</b>.</li>'+
   '<li>The backbone (C–C and C–H bonds) is <b>nonpolar</b>. It only has London dispersion forces, and a longer backbone makes them stronger and lowers water solubility.</li>'+
   '<li>A <b>functional group</b> is an atom or small group of atoms that is not just C–C and C–H: for example O, N, Cl, C=O or C=C. It sets <b>polarity, intermolecular forces, acidity and reactivity</b>.</li>'+
   '<li>Same backbone, different group, different substance. <b>Ethane</b> (no group) boils at −89 °C. <b>Ethanol</b> (–OH added) boils at 78 °C.</li></ul>';
  ex.append(L,R);a.append(ex);frag.push(a);
  const b=h('article','card');
  b.innerHTML='<div class="card-h"><span class="tag">Idea 2</span><h3>One molecule, several ways to draw it</h3></div><p class="brief">Skeletal drawings leave out carbons and hydrogens to save space. Corners and line ends are carbon, and each carbon has hydrogens to make 4 bonds in total. Pick a molecule and switch the view.</p>';
  const sel=h('div','segs');sel.style.margin='12px 0';let cur=0,view=0,vw=null;
  const row=h('div','ex'),Lf=h('div'),Rr=h('div'),fig=h('div'),st2=h('div','stage');
  const vseg=h('div','segs');vseg.style.marginTop='10px';
  const info=h('div','readout');
  Lf.append(fig,vseg);Rr.append(st2,info);row.append(Lf,Rr);
  function draw(){

/* ---------- 2D structure drawings (practice, cis/trans) ---------- */
const STRUCT={ethanol:['Ethanol','CCO'],dme:['Dimethyl ether','COC'],propene:['Propene','CC=C'],but1ene:['But-1-ene','C=CCC'],but2ene:['But-2-ene','CC=CC'],isobutene:['2-Methylpropene','C=C(C)C'],
 ethane:['Ethane','CC'],ethene:['Ethene','C=C'],ethyne:['Ethyne','C#C'],propanone:['Propanone','CC(=O)C'],pentane:['Pentane','CCCCC'],neopentane:['2,2-Dimethylpropane','CC(C)(C)C'],
 methanol:['Methanol','CO'],hexanol:['Hexan-1-ol','CCCCCCO'],propanol:['Propan-1-ol','CCCO'],ethanoic:['Ethanoic acid','CC(=O)O'],phenol:['Phenol',null],methylamine:['Methylamine','CN'],
 mformate:['Methyl methanoate','COC=O'],propane:['Propane','CCC'],hexane:['Hexane','CCCCCC'],methane:['Methane','C'],ammonia:['Ammonia','N'],nitrile:['Ethanenitrile','CC#N'],clacid:['Chloroethanoic acid','OC(=O)CCl']};
const VAL={C:4,O:2,N:3,Cl:1,Br:1,H:1};
const lw=t=>[...t].reduce((a,c)=>a+('₀₁₂₃₄₅₆₇₈₉'.includes(c)?7:10.5),0);
function drawStruct(pts,bonds){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)});
  const pad=22,W=x1-x0+2*pad,H=y1-y0+2*pad,ox=pad-x0,oy=pad-y0;
  let s='<svg class="fig" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'" style="width:'+Math.round(W)+'px;background:none" role="img" aria-hidden="true">';
  bonds.forEach(([i,j,o])=>{
    const p=pts[i],q=pts[j];let ax=p.x,ay=p.y,bx=q.x,by=q.y;const Ln=Math.hypot(bx-ax,by-ay),ux=(bx-ax)/Ln,uy=(by-ay)/Ln,nx=-uy,ny=ux;
    const sh=e=>e.t?Math.min((lw(e.t)/2+4)/Math.max(Math.abs(ux),.001),13/Math.max(Math.abs(uy),.001)):0,s1=sh(p),s2=sh(q);ax+=ux*s1;ay+=uy*s1;bx-=ux*s2;by-=uy*s2;
    (o===1?[0]:o===2?[-2.8,2.8]:[-3.8,0,3.8]).forEach(f=>{s+='<line x1="'+(ax+nx*f+ox).toFixed(1)+'" y1="'+(ay+ny*f+oy).toFixed(1)+'" x2="'+(bx+nx*f+ox).toFixed(1)+'" y2="'+(by+ny*f+oy).toFixed(1)+'" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/>'});
  });
  pts.forEach(p=>{if(p.t)s+='<text x="'+(p.x+ox).toFixed(1)+'" y="'+(p.y+oy+5).toFixed(1)+'" text-anchor="middle" font-size="15" font-weight="700" fill="'+p.col+'">'+p.t+'</text>'});
  return s+'</svg>';
}
function structSVG(key){
  if(key==='phenol'){
    const R=26,pts=[{x:0,y:-R-36,t:'OH',col:'var(--red)'}];
    for(let k=0;k<6;k++){const a=(-90+60*k)*Math.PI/180;pts.push({x:R*Math.cos(a),y:R*Math.sin(a),t:'',col:''})}
    return drawStruct(pts,[[0,1,1],[1,2,2],[2,3,1],[3,4,2],[4,5,1],[5,6,2],[6,1,1]]);
  }
  const m=getMol({smi:STRUCT[key][1]}),n=m.nHeavy,adj=Array.from({length:n},()=>[]);
  m.bonds.forEach(b=>{if(b.a<n&&b.b<n){adj[b.a].push([b.b,b.o]);adj[b.b].push([b.a,b.o])}});
  const pos=Array(n),L=50;pos[0]=[0,0];
  (function place(i,par,d,inO){
    const ch=adj[i].filter(x=>x[0]!==par);let angs;
    if(inO===3||ch.some(x=>x[1]===3))angs=[d];else if(ch.length===1){const c1=d+60,c2=d-60;angs=[Math.cos(c1*Math.PI/180)>=Math.cos(c2*Math.PI/180)?c1:c2]}else if(ch.length===2)angs=[d-60,d+60];else angs=[d,d+90,d-90];
    ch.forEach((c,k)=>{const a=angs[k]*Math.PI/180;pos[c[0]]=[pos[i][0]+L*Math.cos(a),pos[i][1]+L*Math.sin(a)];place(c[0],i,angs[k],c[1])});
  })(0,-1,-30,1);
  const col={C:'var(--ink)',O:'var(--red)',N:'var(--blue)',Cl:'var(--good)',Br:'var(--warn)'};
  const pts=pos.map((p,i)=>{const el=m.atoms[i].el;let u=0;adj[i].forEach(x=>u+=x[1]);const hc=VAL[el]-u;
    return {x:p[0],y:p[1],t:el+(hc>0?'H'+(hc>1?subU(hc):''):''),col:col[el]||'var(--ink)'}});
  const bonds=[];m.bonds.forEach(b=>{if(b.a<n&&b.b<n)bonds.push([b.a,b.b,b.o])});
  return drawStruct(pts,bonds);
}
function structRow(keys){
  const r=h('div','strow');r.setAttribute('role','group');r.setAttribute('aria-label','Structures of the compounds in this question');
  keys.forEach(k=>{const e=STRUCT[k],c=h('div','stc');
    const f=e[1]?T(Chem.formula(getMol({smi:e[1]}))):'C6H6O';
    c.innerHTML=structSVG(k)+'<b>'+e[0]+'</b><span class="pnote">'+(e[1]?f:T(f))+'</span>';r.append(c)});
  return r;
}

/* ---------- cis / trans worked example (station 2) ---------- */
function ctSteps(cis){
  return [
   {t:'Start with the double bond',d:'The C=C is 1 σ bond plus 1 π bond. The π bond holds the two carbons and the four atoms attached to them in one flat plane, and it stops the ends from twisting.',heavy:[1,2],hl:[1,2],tag:{a:[1,2],t:'C=C: σ + π'}},
   {t:'Attach one CH₃ group to each carbon',d:'Each carbon of the double bond now carries a CH₃ group. These are the two groups we will compare.',heavy:[0,1,2,3],hl:[0,3],tag:{a:[0,3],t:'CH₃'}},
   {t:'Condition 1: two different groups on each C',d:'Fill with H. Each carbon of the C=C now has two different groups: CH₃ and H. If one carbon had two identical groups (for example two H), swapping them would give the same molecule and there would be no cis or trans form.',h:[0,1,2,3],hl:[1,2],tag:{a:[1,2],t:'each C: CH₃ + H'}},
   {t:cis?'Condition 2: CH₃ groups on the SAME side, cis':'Condition 2: CH₃ groups on OPPOSITE sides, trans',d:cis?'Both CH₃ groups point to the same side of the double bond. The two C–CH₃ bond dipoles add up, so the molecule has a small net dipole and a slightly higher boiling point (3.7 °C).':'The CH₃ groups point to opposite sides of the double bond. The two C–CH₃ bond dipoles cancel, so the molecule is nonpolar overall and boils at 0.9 °C.',hl:[0,3],cam:[180,0],tag:{a:[0,3],t:cis?'same side: cis':'opposite sides: trans'}},
   {t:'Why they cannot interconvert',d:'To swap cis and trans you would have to rotate one carbon by 180°. That breaks the π bond, which costs roughly 270 kJ/mol (614 for C=C minus 347 for C–C). This does not happen at room temperature, so cis and trans are two separate compounds. Drag the model to check the planar shape.',hl:[1,2],tag:{a:[1,2],t:'π bond: no rotation'}}
  ];
}
function buildCisTrans(){
  const box=h('div','ctbox');
  box.innerHTML='<div class="card-h" style="margin:0"><span class="tag">Worked example</span><h3>What makes cis and trans possible?</h3></div><div class="cond"><div><b>Condition 1</b>Each carbon of the C=C must carry two <em>different</em> groups.</div><div><b>Condition 2</b>The π bond must block rotation, so the groups stay fixed on one side or the other.</div></div>';

}

function go(i,noScroll){
